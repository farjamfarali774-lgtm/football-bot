name: update-data

# Keeps data/raw in sync with football-data.co.uk (results + closing odds).
# The bot reads that folder, so a stale folder means stale predictions.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: download latest results and fixtures
        run: python fetch_data.py --current

      - name: commit new data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "no new data"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed"
              break
            fi
            sleep 5
          done
