name: telegram-bot

# Backup runner only - NOT the primary way the bot stays online.
#
# GitHub's schedule trigger has been unreliable for months (many 2026 reports of
# cron never firing at all), and a scheduled run also has to install pandas and
# numpy before it can answer, so replies arrive a minute or two late.
#
# The bot normally runs on the owner's machine: run_bot.bat, started at login by
# the "FootballBot" scheduled task. This workflow stays for manual runs:
#     gh workflow run telegram-bot
# It listens for ~4.5 minutes and exits, so trigger it only when the local
# runner is off, otherwise both processes fight over getUpdates.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: check secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::error::TELEGRAM_TOKEN secret is missing (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi

      - name: listen for messages
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py --listen 280

      - name: save update offset
        if: always()
        run: |
          if [ -z "$(git status --porcelain .state)" ]; then
            echo "offset unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state
          git commit -m "bot: update offset"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed"
              break
            fi
            sleep 5
          done
